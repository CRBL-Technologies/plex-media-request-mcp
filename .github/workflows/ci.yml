name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_BASE_IMAGE: python:3.12-slim@sha256:dd29372629eeba2dd003fd9e9d35a5b8236c44727875a0364254b5127af88e65
  HERMES_BASE_IMAGE: nousresearch/hermes-agent@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e

jobs:
  verify:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify Python
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy src
          pytest -q
          pip-audit -r requirements.txt --require-hashes
          pip-audit -r deployment/hermes-requirements.txt --require-hashes
      - name: Validate Compose
        env:
          MEDIA_GATEWAY_IMAGE: ghcr.io/crbl-technologies/media-request-companion@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          HERMES_MEDIA_IMAGE: ghcr.io/crbl-technologies/hermes-media@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          HERMES_DATA_DIR: /tmp/hermes
          GATEWAY_STATE_DIR: /tmp/state
          UPSTREAM_ENV_FILE: ${{ github.workspace }}/deployment/upstream.env.example
          GATEWAY_CONFIG_FILE: /tmp/gateway.env
          GATEWAY_TOKEN_FILE: /tmp/gateway.key
          DASHBOARD_PASSWORD_HASH_FILE: /tmp/password.hash
          DASHBOARD_SESSION_KEY_FILE: /tmp/session.key
          PLEX_WEBHOOK_TOKEN_FILE: /tmp/plex.key
        run: docker compose -f deployment/compose.yaml config >/dev/null
      - name: Build gateway
        run: >-
          docker build --build-arg PYTHON_BASE_IMAGE="$PYTHON_BASE_IMAGE"
          --build-arg SOURCE_COMMIT="$GITHUB_SHA"
          -f deployment/Dockerfile.gateway -t crbl-media-gateway:ci .
      - name: Verify gateway container stays running
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/media-gateway-smoke"
          mkdir -p "$smoke/state"
          chmod 0777 "$smoke/state"
          printf '%s\n' 'TELEGRAM_ALLOWED_USERS=1' 'TELEGRAM_ADMIN_USERS=1' > "$smoke/policy.env"
          printf '%064d\n' 0 > "$smoke/gateway.key"
          printf '%064d\n' 0 > "$smoke/session.key"
          printf '%064d\n' 0 > "$smoke/plex.key"
          printf '%s\n' 'placeholder-password-hash' > "$smoke/password.hash"
          printf '%s\n' 'MCP_AUTH_TOKEN=00000000000000000000000000000000' > "$smoke/upstream.env"
          set +e
          timeout 5s docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev \
            -e MEDIA_GATEWAY_HOST=127.0.0.1 \
            -e MEDIA_GATEWAY_PORT=18082 \
            -e MEDIA_GATEWAY_DB_PATH=/opt/data/state/gateway.sqlite3 \
            -e MEDIA_GATEWAY_POLICY_FILE=/opt/hermes-data/.env \
            -e MEDIA_GATEWAY_TOKEN_FILE=/run/media-secrets/gateway.key \
            -e MEDIA_GATEWAY_UPSTREAM_URL=http://127.0.0.1:3000 \
            -e MEDIA_GATEWAY_UPSTREAM_TOKEN_FILE=/run/media-secrets/upstream.env \
            -e MEDIA_GATEWAY_DASHBOARD_PASSWORD_HASH_FILE=/run/media-secrets/password.hash \
            -e MEDIA_GATEWAY_DASHBOARD_SESSION_KEY_FILE=/run/media-secrets/session.key \
            -e MEDIA_GATEWAY_PLEX_WEBHOOK_TOKEN_FILE=/run/media-secrets/plex.key \
            -e MEDIA_GATEWAY_RADARR_PROFILE_ID=25 \
            -e MEDIA_GATEWAY_RADARR_ROOT=/data/media/movies \
            -e MEDIA_GATEWAY_SONARR_PROFILE_ID=25 \
            -e MEDIA_GATEWAY_SONARR_ROOT=/data/media/tv \
            -e MEDIA_GATEWAY_PLEX_MACHINE_ID=smoke \
            -e MEDIA_GATEWAY_TELEGRAM_IDENTITY_SYNC=false \
            -v "$smoke/state:/opt/data/state" \
            -v "$smoke/policy.env:/opt/hermes-data/.env:ro" \
            -v "$smoke/gateway.key:/run/media-secrets/gateway.key:ro" \
            -v "$smoke/session.key:/run/media-secrets/session.key:ro" \
            -v "$smoke/plex.key:/run/media-secrets/plex.key:ro" \
            -v "$smoke/password.hash:/run/media-secrets/password.hash:ro" \
            -v "$smoke/upstream.env:/run/media-secrets/upstream.env:ro" \
            crbl-media-gateway:ci
          status=$?
          set -e
          test "$status" -eq 124
      - name: Build Hermes adapter
        run: >-
          docker build --build-arg HERMES_BASE_IMAGE="$HERMES_BASE_IMAGE"
          --build-arg SOURCE_COMMIT="$GITHUB_SHA"
          -f deployment/Dockerfile.hermes -t crbl-hermes-media:ci .
      - name: Verify Hermes adapter under s6-overlay
        shell: bash
        run: |
          set -euo pipefail
          network="crbl-hermes-ci-$GITHUB_RUN_ID"
          stub="crbl-gateway-stub-$GITHUB_RUN_ID"
          cleanup() {
            docker rm -f "$stub" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          smoke="$RUNNER_TEMP/hermes-adapter-smoke"
          mkdir -p "$smoke/data"
          chmod 0777 "$smoke/data"
          cp "$GITHUB_WORKSPACE/tests/hermes_config_smoke.yaml" "$smoke/data/config.yaml"
          chmod 0666 "$smoke/data/config.yaml"
          printf '%064d\n' 0 > "$smoke/gateway.key"
          docker network create "$network" >/dev/null
          docker run --detach --rm --name "$stub" --network "$network" --network-alias gateway \
            -e PYTHONPATH=/app/src \
            -v "$GITHUB_WORKSPACE/src:/app/src:ro" \
            -v "$GITHUB_WORKSPACE/tests/hermes_gateway_stub.py:/app/stub.py:ro" \
            python:3.12-slim@sha256:dd29372629eeba2dd003fd9e9d35a5b8236c44727875a0364254b5127af88e65 \
            python /app/stub.py >/dev/null
          docker run --rm --network "$network" \
            -v "$smoke/data:/opt/data" \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m \
            --tmpfs /run:rw,exec,nosuid,nodev,size=64m \
            -e HERMES_UID=1000 \
            -e HERMES_GID=1000 \
            -e HERMES_HOME=/opt/data \
            -e CRBL_MEDIA_GATEWAY_URL=http://gateway:18082 \
            -e CRBL_MEDIA_GATEWAY_TOKEN_FILE=/run/media-secrets/gateway.key \
            -v "$smoke/gateway.key:/run/media-secrets/gateway.key:ro" \
            crbl-hermes-media:ci true
          # The identity file must be installed into HERMES_HOME by the init
          # script, byte for byte from the image. Nothing else reads SOUL.md
          # early enough for a failed install to surface on its own.
          diff "$GITHUB_WORKSPACE/src/hermes_media/SOUL.md" "$smoke/data/SOUL.md"
