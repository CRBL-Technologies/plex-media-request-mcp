name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  PYTHON_BASE_IMAGE: python:3.12-slim@sha256:4840d514c583a4d3d8cad3940e68dee6f0f6f3635c12fcd0a3d74c21a5b93a54

jobs:
  verify:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify Python
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy src
          pytest -q
          pip-audit -r requirements.txt --require-hashes
      - name: Validate Compose
        env:
          MEDIA_GATEWAY_IMAGE: ghcr.io/crbl-technologies/media-request-companion@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          MEDIA_BOT_MODEL: openai/ci
          HERMES_DATA_DIR: /tmp/hermes
          GATEWAY_STATE_DIR: /tmp/state
          BOT_STATE_DIR: /tmp/bot-state
          UPSTREAM_ENV_FILE: ${{ github.workspace }}/deployment/upstream.env.example
          GATEWAY_CONFIG_FILE: /tmp/gateway.env
          GATEWAY_TOKEN_FILE: /tmp/gateway.key
          DASHBOARD_PASSWORD_HASH_FILE: /tmp/password.hash
          DASHBOARD_SESSION_KEY_FILE: /tmp/session.key
          PLEX_WEBHOOK_TOKEN_FILE: /tmp/plex.key
          GATEWAY_ONEPASSWORD_FILE: /tmp/onepassword.json
          BOT_ONEPASSWORD_FILE: /tmp/bot-onepassword.json
          UPSTREAM_ONEPASSWORD_FILE: /tmp/upstream-onepassword.json
          MEDIA_UPSTREAM_IMAGE: ghcr.io/crbl-technologies/media-server-mcp-managed@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        run: |
          docker compose --env-file /dev/null -f deployment/compose.yaml config --quiet
          docker compose --env-file /dev/null -f deployment/compose.managed.yaml config --quiet
      - name: Build gateway
        run: >-
          docker build --build-arg PYTHON_BASE_IMAGE="$PYTHON_BASE_IMAGE"
          --build-arg SOURCE_COMMIT="$GITHUB_SHA"
          -f deployment/Dockerfile.gateway -t crbl-media-gateway:ci .
      - name: Verify gateway container stays running
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/media-gateway-smoke"
          mkdir -p "$smoke/state"
          chmod 0777 "$smoke/state"
          printf '%s\n' 'TELEGRAM_ALLOWED_USERS=1' 'TELEGRAM_ADMIN_USERS=1' > "$smoke/policy.env"
          printf '%064d\n' 0 > "$smoke/gateway.key"
          printf '%064d\n' 0 > "$smoke/session.key"
          printf '%064d\n' 0 > "$smoke/plex.key"
          printf '%s\n' 'placeholder-password-hash' > "$smoke/password.hash"
          printf '%s\n' 'MCP_AUTH_TOKEN=00000000000000000000000000000000' > "$smoke/upstream.env"
          set +e
          timeout 5s docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev \
            -e MEDIA_GATEWAY_HOST=127.0.0.1 \
            -e MEDIA_GATEWAY_PORT=18082 \
            -e MEDIA_GATEWAY_DB_PATH=/opt/data/state/gateway.sqlite3 \
            -e MEDIA_GATEWAY_POLICY_FILE=/opt/hermes-data/.env \
            -e MEDIA_GATEWAY_TOKEN_FILE=/run/media-secrets/gateway.key \
            -e MEDIA_GATEWAY_UPSTREAM_URL=http://127.0.0.1:3000 \
            -e MEDIA_GATEWAY_UPSTREAM_TOKEN_FILE=/run/media-secrets/upstream.env \
            -e MEDIA_GATEWAY_DASHBOARD_PASSWORD_HASH_FILE=/run/media-secrets/password.hash \
            -e MEDIA_GATEWAY_DASHBOARD_SESSION_KEY_FILE=/run/media-secrets/session.key \
            -e MEDIA_GATEWAY_PLEX_WEBHOOK_TOKEN_FILE=/run/media-secrets/plex.key \
            -e MEDIA_GATEWAY_RADARR_PROFILE_ID=25 \
            -e MEDIA_GATEWAY_RADARR_ROOT=/data/media/movies \
            -e MEDIA_GATEWAY_SONARR_PROFILE_ID=25 \
            -e MEDIA_GATEWAY_SONARR_ROOT=/data/media/tv \
            -e MEDIA_GATEWAY_PLEX_MACHINE_ID=smoke \
            -e MEDIA_GATEWAY_TELEGRAM_IDENTITY_SYNC=false \
            -v "$smoke/state:/opt/data/state" \
            -v "$smoke/policy.env:/opt/hermes-data/.env:ro" \
            -v "$smoke/gateway.key:/run/media-secrets/gateway.key:ro" \
            -v "$smoke/session.key:/run/media-secrets/session.key:ro" \
            -v "$smoke/plex.key:/run/media-secrets/plex.key:ro" \
            -v "$smoke/password.hash:/run/media-secrets/password.hash:ro" \
            -v "$smoke/upstream.env:/run/media-secrets/upstream.env:ro" \
            crbl-media-gateway:ci
          status=$?
          set -e
          test "$status" -eq 124
      - name: Build managed gateway and verify pinned CLI
        run: |
          docker build --target managed --build-arg PYTHON_BASE_IMAGE="$PYTHON_BASE_IMAGE" \
            --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            -f deployment/Dockerfile.gateway -t crbl-media-gateway-managed:ci .
          test "$(docker run --rm --network none --entrypoint /usr/local/bin/op crbl-media-gateway-managed:ci --version)" = '2.42.0'
      - name: Build and verify managed media images
        run: |
          docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            -f deployment/Dockerfile.upstream-managed -t crbl-media-upstream-managed:ci .
          docker run --rm --network none --entrypoint deno \
            -v "$GITHUB_WORKSPACE/tests/upstream_runtime_test.ts:/app/tests/upstream_runtime_test.ts:ro" \
            crbl-media-upstream-managed:ci test --allow-read --allow-write --allow-env --allow-run --allow-sys /app/tests/upstream_runtime_test.ts
          python tests/managed_container_smoke.py \
            crbl-media-gateway-managed:ci crbl-media-upstream-managed:ci
