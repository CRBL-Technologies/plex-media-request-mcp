name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Run unit tests
        run: python -W error::ResourceWarning -m unittest -q

      - name: Check repository hygiene
        run: python scripts/check_public_repo.py

      - name: Check lint and formatting
        run: |
          ruff check .
          ruff format --check .

      - name: Check types
        run: mypy --check-untyped-defs media_request_server.py radarr_webhook_bridge.py scripts/check_public_repo.py

      - name: Validate OpenAPI document
        run: openapi-spec-validator docs/openapi.yaml

      - name: Audit production dependencies
        run: pip-audit -r requirements.txt

      - name: Build MCP image
        run: docker build --pull -t plex-media-request-mcp:ci -f Dockerfile .

      - name: Build webhook image
        run: docker build --pull -t plex-media-request-webhook:ci -f Dockerfile.webhook .
