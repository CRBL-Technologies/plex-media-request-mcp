name: Publish container images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      hermes_base_image:
        description: "Immutable Hermes v2026.8.3 base image (repository@sha256:digest)"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  # Both bases are reviewed and pinned by digest. A manual dispatch may supply
  # a different immutable Hermes digest when its upstream release is reviewed;
  # ordinary pushes remain reproducible without a repository variable.
  PYTHON_BASE_IMAGE: python:3.12-slim-bookworm@sha256:d50fb7611f86d04a3b0471b46d7557818d88983fc3136726336b2a4c657aa30b
  HERMES_BASE_IMAGE: ${{ inputs.hermes_base_image || 'nousresearch/hermes-agent@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e' }}

jobs:
  verify:
    name: Pre-publish test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Run verification suite
        run: |
          python -W error::ResourceWarning -m pytest -q
          python scripts/check_public_repo.py
          python -m py_compile scripts/validate_deployment.py
          python scripts/validate_deployment.py --help >/dev/null
          ruff check .
          ruff format --check .
          mypy --check-untyped-defs media_request_server.py radarr_webhook_bridge.py scripts/check_public_repo.py src hermes_media_extension
          openapi-spec-validator docs/openapi.yaml
          pip-audit -r requirements.txt
          python -m pytest -q tests/test_deployment_assets.py tests/test_release_contracts.py

  publish:
    name: Publish immutable images
    needs: verify
    runs-on: ubuntu-latest
    env:
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Validate immutable build inputs
        run: |
          set -euo pipefail
          [[ "$PYTHON_BASE_IMAGE" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]
          [[ -n "$HERMES_BASE_IMAGE" ]]
          [[ "$HERMES_BASE_IMAGE" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]
          test -f deployment/Dockerfile.companion
          test -f deployment/Dockerfile.dashboard
          test -f deployment/Dockerfile.hermes
          test -f scripts/validate_deployment.py
          docker buildx build --check --file deployment/Dockerfile.companion \
            --build-arg PYTHON_BASE_IMAGE="$PYTHON_BASE_IMAGE" .
          docker buildx build --check --file deployment/Dockerfile.dashboard \
            --build-arg PYTHON_BASE_IMAGE="$PYTHON_BASE_IMAGE" .
          docker buildx build --check --file deployment/Dockerfile.hermes \
            --build-arg HERMES_BASE_IMAGE="$HERMES_BASE_IMAGE" .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract companion Docker metadata
        id: meta_companion
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/crbl-technologies/media-request-companion
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long

      - name: Build and push companion image
        id: build_companion
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./deployment/Dockerfile.companion
          pull: true
          push: true
          build-args: |
            PYTHON_BASE_IMAGE=${{ env.PYTHON_BASE_IMAGE }}
            SOURCE_COMMIT=${{ env.SOURCE_COMMIT }}
          tags: ${{ steps.meta_companion.outputs.tags }}
          labels: ${{ steps.meta_companion.outputs.labels }}
          cache-from: type=gha,scope=companion
          cache-to: type=gha,mode=max,scope=companion
          sbom: true
          provenance: mode=max

      - name: Record companion immutable digest
        env:
          IMAGE_DIGEST: ${{ steps.build_companion.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          echo "ghcr.io/crbl-technologies/media-request-companion@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Extract dashboard Docker metadata
        id: meta_dashboard
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/crbl-technologies/media-request-dashboard
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long

      - name: Build and push dashboard image
        id: build_dashboard
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./deployment/Dockerfile.dashboard
          pull: true
          push: true
          build-args: |
            PYTHON_BASE_IMAGE=${{ env.PYTHON_BASE_IMAGE }}
            SOURCE_COMMIT=${{ env.SOURCE_COMMIT }}
          tags: ${{ steps.meta_dashboard.outputs.tags }}
          labels: ${{ steps.meta_dashboard.outputs.labels }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
          sbom: true
          provenance: mode=max

      - name: Record dashboard immutable digest
        env:
          IMAGE_DIGEST: ${{ steps.build_dashboard.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          echo "ghcr.io/crbl-technologies/media-request-dashboard@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Extract Hermes Docker metadata
        id: meta_hermes
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/crbl-technologies/hermes-media
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long

      - name: Build and push Hermes derived image
        id: build_hermes
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./deployment/Dockerfile.hermes
          pull: true
          push: true
          build-args: |
            HERMES_BASE_IMAGE=${{ env.HERMES_BASE_IMAGE }}
            SOURCE_COMMIT=${{ env.SOURCE_COMMIT }}
          tags: ${{ steps.meta_hermes.outputs.tags }}
          labels: ${{ steps.meta_hermes.outputs.labels }}
          cache-from: type=gha,scope=hermes
          cache-to: type=gha,mode=max,scope=hermes
          sbom: true
          provenance: mode=max

      - name: Record Hermes immutable digest
        env:
          IMAGE_DIGEST: ${{ steps.build_hermes.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          echo "ghcr.io/crbl-technologies/hermes-media@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
