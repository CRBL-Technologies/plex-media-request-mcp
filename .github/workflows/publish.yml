name: Publish images

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  PYTHON_BASE_IMAGE: python:3.12-slim@sha256:4840d514c583a4d3d8cad3940e68dee6f0f6f3635c12fcd0a3d74c21a5b93a54

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: gateway_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/crbl-technologies/media-request-companion
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=long
            type=ref,event=tag
      - id: gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deployment/Dockerfile.gateway
          push: true
          pull: true
          build-args: |
            PYTHON_BASE_IMAGE=${{ env.PYTHON_BASE_IMAGE }}
            SOURCE_COMMIT=${{ github.sha }}
          tags: ${{ steps.gateway_meta.outputs.tags }}
          labels: ${{ steps.gateway_meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - id: managed_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/crbl-technologies/media-request-companion-managed
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=long
            type=ref,event=tag
      - id: managed
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deployment/Dockerfile.gateway
          target: managed
          push: true
          pull: true
          build-args: |
            PYTHON_BASE_IMAGE=${{ env.PYTHON_BASE_IMAGE }}
            SOURCE_COMMIT=${{ github.sha }}
          tags: ${{ steps.managed_meta.outputs.tags }}
          labels: ${{ steps.managed_meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - id: managed_upstream_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/crbl-technologies/media-server-mcp-managed
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=long
            type=ref,event=tag
      - id: managed_upstream
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deployment/Dockerfile.upstream-managed
          push: true
          pull: true
          build-args: SOURCE_COMMIT=${{ github.sha }}
          tags: ${{ steps.managed_upstream_meta.outputs.tags }}
          labels: ${{ steps.managed_upstream_meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Record immutable references
        run: |
          echo "ghcr.io/crbl-technologies/media-request-companion@${{ steps.gateway.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/crbl-technologies/media-request-companion-managed@${{ steps.managed.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/crbl-technologies/media-server-mcp-managed@${{ steps.managed_upstream.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
