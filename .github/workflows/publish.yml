name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  PYTHON_BASE_IMAGE: python:3.12-slim@sha256:dd29372629eeba2dd003fd9e9d35a5b8236c44727875a0364254b5127af88e65
  HERMES_BASE_IMAGE: nousresearch/hermes-agent@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: gateway_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/crbl-technologies/media-request-companion
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
      - id: gateway
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deployment/Dockerfile.gateway
          push: true
          pull: true
          build-args: |
            PYTHON_BASE_IMAGE=${{ env.PYTHON_BASE_IMAGE }}
            SOURCE_COMMIT=${{ github.sha }}
          tags: ${{ steps.gateway_meta.outputs.tags }}
          labels: ${{ steps.gateway_meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - id: hermes_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/crbl-technologies/hermes-media
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
      - id: hermes
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deployment/Dockerfile.hermes
          push: true
          pull: true
          build-args: |
            HERMES_BASE_IMAGE=${{ env.HERMES_BASE_IMAGE }}
            SOURCE_COMMIT=${{ github.sha }}
          tags: ${{ steps.hermes_meta.outputs.tags }}
          labels: ${{ steps.hermes_meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Record immutable references
        run: |
          echo "ghcr.io/crbl-technologies/media-request-companion@${{ steps.gateway.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/crbl-technologies/hermes-media@${{ steps.hermes.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
