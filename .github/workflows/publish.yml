name: Publish images

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  PYTHON_BASE_IMAGE: python:3.12-slim@sha256:dd29372629eeba2dd003fd9e9d35a5b8236c44727875a0364254b5127af88e65
  HERMES_BASE_IMAGE: nousresearch/hermes-agent@sha256:e0df6adebddf29b91112aefc999d4aaf6846c9eb544faca5672a16a13590ff79

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: gateway_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/crbl-technologies/media-request-companion
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=long
            type=ref,event=tag
      - id: gateway
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deployment/Dockerfile.gateway
          push: true
          pull: true
          build-args: |
            PYTHON_BASE_IMAGE=${{ env.PYTHON_BASE_IMAGE }}
            SOURCE_COMMIT=${{ github.sha }}
          tags: ${{ steps.gateway_meta.outputs.tags }}
          labels: ${{ steps.gateway_meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - id: hermes_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/crbl-technologies/hermes-media
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=long
            type=ref,event=tag
      - id: hermes
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deployment/Dockerfile.hermes
          push: true
          pull: true
          build-args: |
            HERMES_BASE_IMAGE=${{ env.HERMES_BASE_IMAGE }}
            SOURCE_COMMIT=${{ github.sha }}
          tags: ${{ steps.hermes_meta.outputs.tags }}
          labels: ${{ steps.hermes_meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - id: managed_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/crbl-technologies/media-request-companion-managed
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=long
            type=ref,event=tag
      - id: managed
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deployment/Dockerfile.gateway
          target: managed
          push: true
          pull: true
          build-args: |
            PYTHON_BASE_IMAGE=${{ env.PYTHON_BASE_IMAGE }}
            SOURCE_COMMIT=${{ github.sha }}
          tags: ${{ steps.managed_meta.outputs.tags }}
          labels: ${{ steps.managed_meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - id: managed_hermes_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/crbl-technologies/hermes-media-managed
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=long
            type=ref,event=tag
      - id: managed_hermes
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deployment/Dockerfile.hermes
          target: managed
          push: true
          pull: true
          build-args: |
            HERMES_BASE_IMAGE=${{ env.HERMES_BASE_IMAGE }}
            SOURCE_COMMIT=${{ github.sha }}
          tags: ${{ steps.managed_hermes_meta.outputs.tags }}
          labels: ${{ steps.managed_hermes_meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - id: managed_upstream_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/crbl-technologies/media-server-mcp-managed
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=long
            type=ref,event=tag
      - id: managed_upstream
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deployment/Dockerfile.upstream-managed
          push: true
          pull: true
          build-args: SOURCE_COMMIT=${{ github.sha }}
          tags: ${{ steps.managed_upstream_meta.outputs.tags }}
          labels: ${{ steps.managed_upstream_meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Record immutable references
        run: |
          echo "ghcr.io/crbl-technologies/media-request-companion@${{ steps.gateway.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/crbl-technologies/hermes-media@${{ steps.hermes.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/crbl-technologies/media-request-companion-managed@${{ steps.managed.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/crbl-technologies/hermes-media-managed@${{ steps.managed_hermes.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/crbl-technologies/media-server-mcp-managed@${{ steps.managed_upstream.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
