# Separate managed recipe. Do not merge with compose.yaml: its old read-only
# file mounts would cover the private tmpfs projection paths. Locally generated
# keys stay in their existing host files, mounted read-only under /run/media-keys.
# Saved legacy Portainer fields can remain during proof; only the host-file paths
# below are read by this recipe.
name: hermes-media

services:
  media-server-mcp:
    image: ${MEDIA_UPSTREAM_IMAGE:?required managed upstream digest}
    restart: unless-stopped
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [--http, --host, 0.0.0.0, --port, "3000"]
    environment:
      TOOL_PROFILE: full
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /run/media-secrets:rw,noexec,nosuid,nodev,size=1m,uid=1000,gid=1000,mode=0700
    volumes:
      - ${UPSTREAM_ONEPASSWORD_FILE:?required owner-provisioned bootstrap file}:/run/secrets/onepassword.json:ro
    expose: ["3000"]
    networks: [media-mcp, media]
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  media-gateway:
    image: ${MEDIA_GATEWAY_IMAGE:?required managed gateway digest}
    restart: unless-stopped
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /run/media-secrets:rw,noexec,nosuid,nodev,size=1m,uid=1000,gid=1000,mode=0700
    environment:
      MEDIA_GATEWAY_HOST: 0.0.0.0
      MEDIA_GATEWAY_PORT: "18082"
      MEDIA_GATEWAY_DB_PATH: /opt/data/state/gateway.sqlite3
      MEDIA_GATEWAY_POLICY_FILE: /opt/hermes-data/.env
      MEDIA_GATEWAY_TOKEN_FILE: /run/media-keys/gateway.key
      MEDIA_GATEWAY_UPSTREAM_TOKEN_FILE: /run/media-secrets/upstream.env
      MEDIA_GATEWAY_DASHBOARD_HOST: media-admin
      MEDIA_GATEWAY_DASHBOARD_PORT: "18083"
      MEDIA_GATEWAY_DASHBOARD_ALLOWED_HOSTS: ${DASHBOARD_ALLOWED_HOSTS:?required host names of the private dashboard}
      MEDIA_GATEWAY_PLEX_WEBHOOK_TOKEN_FILE: /run/media-keys/plex-webhook.key
      MEDIA_GATEWAY_TELEGRAM_TOKEN_FILE: /run/media-secrets/telegram.env
    volumes:
      - ${HERMES_DATA_DIR:?required}:/opt/hermes-data:rw
      - ${GATEWAY_STATE_DIR:?required}:/opt/data/state:rw
      - ${GATEWAY_ONEPASSWORD_FILE:?required owner-provisioned bootstrap file}:/run/secrets/onepassword.json:ro
      - ${GATEWAY_TOKEN_FILE:?required}:/run/media-keys/gateway.key:ro
      - ${PLEX_WEBHOOK_TOKEN_FILE:?required}:/run/media-keys/plex-webhook.key:ro
    ports:
      # Loopback only, for the Plex webhook. The API has no port on the home network.
      - "127.0.0.1:18081:18082"
    networks:
      media-bot:
      media-mcp:
      media:
      # The dashboard listens only on this network, under this name.
      media-admin:
        aliases: [media-admin]
    mem_limit: 384m
    pids_limit: 128
    depends_on:
      media-server-mcp:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18082/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  media-bot:
    # Same image as the gateway; only the entrypoint differs. The bot holds the
    # Telegram and OpenRouter credentials and the gateway bearer, nothing else.
    image: ${MEDIA_GATEWAY_IMAGE:?required managed gateway digest}
    restart: unless-stopped
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [python, -m, media_bot.managed_start]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /run/media-secrets:rw,noexec,nosuid,nodev,size=1m,uid=1000,gid=1000,mode=0700
    environment:
      MEDIA_BOT_MODEL: ${MEDIA_BOT_MODEL:?required OpenRouter model ID}
      MEDIA_BOT_STATE_FILE: /opt/data/state/conversations.sqlite3
      CRBL_MEDIA_GATEWAY_TOKEN_FILE: /run/media-keys/gateway.key
      HTTPS_PROXY: http://media-egress:3128
      DDGS_PROXY: http://media-egress:3128
    volumes:
      - ${BOT_ONEPASSWORD_FILE:?required owner-provisioned bootstrap file}:/run/secrets/onepassword.json:ro
      - ${GATEWAY_TOKEN_FILE:?required}:/run/media-keys/gateway.key:ro
      - ${BOT_STATE_DIR:?required}:/opt/data/state:rw
    networks: [media-bot]
    mem_limit: 512m
    pids_limit: 128
    depends_on:
      media-gateway:
        condition: service_healthy
      media-egress:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, media_bot.health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  media-egress:
    # The bot's only way out. It opens HTTPS tunnels to the hosts named in
    # media_bot.egress.ALLOWED_HOSTS and refuses everything else.
    image: ${MEDIA_GATEWAY_IMAGE:?required managed gateway digest}
    restart: unless-stopped
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [python, -m, media_bot.egress]
    networks: [media-bot, media-egress]
    mem_limit: 64m
    pids_limit: 64
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 3128), 3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  # The bot's network has no route out and no address on the host, so the bot
  # reaches the gateway and the egress proxy and nothing else: not the internet,
  # not the NAS, not the home network.
  media-bot:
    name: media-bot
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: 172.30.40.0/24
  media-egress:
    name: media-egress
    driver: bridge
  media-mcp:
    name: media-mcp
    internal: true
    driver: bridge
  # The only path to the dashboard, which has no login: the existing network of
  # the private access connector (on the NAS, the Tailscale Service connector).
  media-admin:
    name: ${DASHBOARD_NETWORK:?required network of the private access connector}
    external: true
  media:
    name: media
    external: true
