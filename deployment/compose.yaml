name: hermes-media

services:
  media-server-mcp:
    image: ghcr.io/wyattjoh/media-server-mcp@sha256:f83620da1d008ef18df3324b15e44854572ea41b528eff585033e4054b438377
    restart: unless-stopped
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    # Portainer is intentionally not mounted into project directories, so it
    # cannot resolve Compose env_file paths itself. Mount the file through the
    # Docker daemon and let the upstream image's native Deno runtime read it.
    entrypoint:
      - deno
      - run
      - --env-file=/run/media-secrets/upstream.env
      - --allow-read
      - --allow-write
      - --allow-env
      - --allow-run
      - --allow-net
      - packages/media-server-mcp/src/index.ts
    command: [--http, --host, 0.0.0.0, --port, "3000"]
    environment:
      UMASK: "0077"
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3000"
      MCP_TRANSPORT: streamable-http
      TOOL_PROFILE: full
    volumes:
      - ${UPSTREAM_ENV_FILE:?required}:/run/media-secrets/upstream.env:ro
    expose: ["3000"]
    networks: [media-mcp, media]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  media-gateway:
    image: ${MEDIA_GATEWAY_IMAGE:?required digest reference}
    restart: unless-stopped
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      MEDIA_GATEWAY_CONFIG_FILE: /run/media-secrets/gateway.env
    volumes:
      - ${HERMES_DATA_DIR:?required}:/opt/hermes-data:rw
      - ${GATEWAY_STATE_DIR:?required}:/opt/data/state:rw
      - ${GATEWAY_CONFIG_FILE:?required}:/run/media-secrets/gateway.env:ro
      - ${UPSTREAM_ENV_FILE:?required}:/run/media-secrets/upstream.env:ro
      - ${GATEWAY_TOKEN_FILE:?required}:/run/media-secrets/gateway.key:ro
      - ${DASHBOARD_PASSWORD_HASH_FILE:?required}:/run/media-secrets/dashboard-password.hash:ro
      - ${DASHBOARD_SESSION_KEY_FILE:?required}:/run/media-secrets/dashboard-session.key:ro
      - ${PLEX_WEBHOOK_TOKEN_FILE:?required}:/run/media-secrets/plex-webhook.key:ro
    ports:
      - "18082:18082"
      - "127.0.0.1:18081:18082"
    networks: [media-bot, media-mcp, media]
    depends_on:
      media-server-mcp:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:18082/readyz', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  media-bot:
    # Same image as the gateway; only the entrypoint differs. The bot holds the
    # Telegram and OpenRouter credentials and the gateway bearer, nothing else.
    image: ${MEDIA_GATEWAY_IMAGE:?required digest reference}
    restart: unless-stopped
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [python, -m, media_bot.bot]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    environment:
      MEDIA_BOT_MODEL: ${MEDIA_BOT_MODEL:?required OpenRouter model ID}
      MEDIA_BOT_STATE_FILE: /opt/data/state/conversations.sqlite3
      MEDIA_BOT_SECRETS_FILE: /opt/hermes-data/.env
      CRBL_MEDIA_GATEWAY_URL: http://media-gateway:18082
      CRBL_MEDIA_GATEWAY_TOKEN_FILE: /run/media-secrets/gateway.key
    volumes:
      - ${HERMES_DATA_DIR:?required}/.env:/opt/hermes-data/.env:ro
      - ${GATEWAY_TOKEN_FILE:?required}:/run/media-secrets/gateway.key:ro
      - ${BOT_STATE_DIR:?required}:/opt/data/state:rw
    networks: [media-bot]
    depends_on:
      media-gateway:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, media_bot.health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  media-bot:
    name: media-bot
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.40.0/24
          gateway: 172.30.40.1
  media-mcp:
    name: media-mcp
    internal: true
    driver: bridge
  media:
    name: media
    external: true
