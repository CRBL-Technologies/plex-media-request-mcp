# Hermes v2026.8.3 derives the deferred platform lookup key by stripping the
# ``-platform`` suffix.  The registry entry itself is explicitly owned by
# ``media-policy`` in plugin.py, but this manifest must resolve to ``telegram``
# so the shim is loaded before Hermes creates the native Telegram adapter.
name: telegram-platform
label: Telegram media policy
kind: platform
version: 1.0.0
description: >
  Pinned Hermes v2026.8.3 Telegram platform override for the CRBL media
  companion. The shim replaces the native telegram registry entry and keeps
  Telegram transport, allowlist admission, and message parsing native.
author: CRBL
requires_env:
  - name: TELEGRAM_BOT_TOKEN
    description: "Telegram bot token (native Hermes Telegram admission)"
    password: true
  - name: CRBL_COMPANION_URL
    description: "Private typed media companion URL"
    password: false
  - name: CRBL_POLICY_HELPER_KEY_FILE
    description: "Mounted policy-helper authentication key path"
    password: false
  - name: CRBL_POLICY_HELPER_HOST
    description: "Private helper bind host (must remain 0.0.0.0 inside media-bot)"
    password: false
  - name: CRBL_POLICY_FILE
    description: "Canonical Hermes .env allowlist path used by the helper"
    password: false
  - name: CRBL_POLICY_HELPER_PORT
    description: "Private-network-only helper port (never host-published)"
    password: false
  - name: CRBL_ACTOR_SIGNING_KEY_FILE
    description: "Mounted actor-signing key path"
    password: false
  - name: TOOL_PROFILE
    description: "Pinned upstream media-server-mcp tool profile"
    password: false
  - name: TOOL_INCLUDE
    description: "Pinned upstream tools omitted by the full profile"
    password: false
