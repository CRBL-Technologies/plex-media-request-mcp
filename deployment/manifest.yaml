# Release manifest template.  Resolve every ${...:?} value from a release
# environment before signing/publishing this file.  No secret value belongs in
# this manifest; only canonical host paths and immutable provenance are stored.

schema_version: 1
release:
  name: plex-media-request
  immutable: true
  compose_file: deployment/compose.yaml
  compose_sha256: "${COMPOSE_SHA256:?set the SHA-256 of the resolved Compose/config bundle}"
  config_sha256: "${CONFIG_SHA256:?set the SHA-256 of the resolved non-secret configuration}"
  migration_checksums_sha256: "${MIGRATION_CHECKSUMS_SHA256:?set the migration checksum artifact digest}"

images:
  media-server-mcp:
    image: "${MEDIA_SERVER_MCP_IMAGE:?set media-server-mcp@sha256:<digest>}"
    source_revision: 8b469d2b321b27dd1e4f5b89a7236b3ea43c3c72
    sbom_sha256: "${UPSTREAM_SBOM_SHA256:?set the upstream SBOM digest}"
  media-companion:
    image: "${MEDIA_COMPANION_IMAGE:?set media-request-companion@sha256:<digest>}"
    source_revision: "${MEDIA_COMPANION_COMMIT:?set the companion commit}"
    sbom_sha256: "${COMPANION_SBOM_SHA256:?set the companion SBOM digest}"
  media-request-dashboard:
    image: "${MEDIA_DASHBOARD_IMAGE:?set media-request-dashboard@sha256:<digest>}"
    source_revision: "${MEDIA_DASHBOARD_COMMIT:?set the dashboard commit}"
    sbom_sha256: "${DASHBOARD_SBOM_SHA256:?set the dashboard SBOM digest}"
  hermes-media:
    image: "${HERMES_MEDIA_IMAGE:?set hermes-media@sha256:<digest>}"
    dockerfile: deployment/Dockerfile.hermes
    base_image: "${HERMES_BASE_IMAGE:?set the pinned Hermes base@sha256:<digest>}"
    base_revision: "${HERMES_BASE_COMMIT:?set the pinned Hermes base revision}"
    policy_extension_revision: "${HERMES_MEDIA_COMMIT:?set the media-policy extension commit}"
    sbom_sha256: "${HERMES_SBOM_SHA256:?set the Hermes/extension SBOM digest}"

runtime:
  uid: 1000
  gid: 1000
  umask: "0077"
  secret_directory_mode: "0700"
  state_directory_mode: "0700"
  secret_file_mode: "0600"
  database_file_mode: "0600"
  hermes_uid: 1000
  hermes_gid: 1000
  hermes_native_s6_pid1: true
  hermes_dashboard: false
  hermes_dashboard_port: null
  published_ports:
    dashboard: "18082:18082"
    plex_webhook: "127.0.0.1:18081:18080"
  internal_ports:
    hermes_policy_helper: "8787"
  docker_socket: false
  plex_service_in_stack: false
  plex_container_mutation_allowed: false

networks:
  private:
    - media-bot
    - media-mcp-backend
    - media-service-egress
    - media-dashboard-backend
  external:
    - media
  memberships:
    hermes-media: [media-bot]
    media-companion: [media-bot, media-mcp-backend, media-service-egress, media-dashboard-backend]
    media-server-mcp: [media-mcp-backend, media-service-egress]
    media-request-dashboard: [media-dashboard-backend, media]

canonical_files:
  hermes_policy_env:
    path: /volume2/docker/hermes-media/data/.env
    mode: "0600"
    consumers: [hermes-media]
    purpose: native Telegram token, allowlist, admin/private-chat policy
  upstream_env:
    path: /volume2/docker/hermes-media/secrets/upstream.env
    mode: "0600"
    consumers: [media-server-mcp, media-companion]
    purpose: configured provider origins and upstream MCP bearer credential
  companion_env:
    path: /volume2/docker/hermes-media/secrets/companion.env
    mode: "0600"
    consumers: [media-companion]
    purpose: companion policy/settings and loopback webhook capability
  actor_signing_key:
    path: /volume2/docker/hermes-media/secrets/actor-signing.key
    mode: "0600"
    consumers: [hermes-media, media-companion]
    purpose: short-lived actor assertions and policy-helper authentication
  dashboard_auth_env:
    path: /volume2/docker/hermes-media/secrets/dashboard-auth.env
    mode: "0600"
    consumers: [media-request-dashboard]
    purpose: password hash, session, origin, and cookie policy
  dashboard_api_key:
    path: /volume2/docker/hermes-media/secrets/dashboard-api.key
    mode: "0600"
    consumers: [media-request-dashboard, media-companion]
    purpose: typed dashboard-to-companion authentication

invariants:
  no_plex_service: true
  no_plex_restart_or_recreate: true
  no_hermes_dashboard_listener: true
  no_port_9119: true
  no_docker_socket_mount: true
  dashboard_requires_authenticated_session: true
  dashboard_healthz_only_anonymous: true
  webhook_loopback_only: true
  mutable_tags_rejected: true
