openapi: 3.1.0
info:
  title: CRBL Media Companion HTTP API
  version: 2.0.0
  description: |
    This document describes the HTTP routes implemented by the media companion
    and the separately deployed private dashboard.  The companion is not a
    public, generic MCP proxy: `/mcp` accepts only JSON-RPC `tools/call`, checks
    an actor assertion bound to the exact tool arguments, and dispatches the
    frozen tool inventories.  The seven shared tools below are the only tools
    available to an ordinary actor.  Pinned upstream/admin tools are available
    only to an independently authorized administrator and are intentionally not
    expanded into a model-controlled HTTP surface here.

    The companion listens on its private service network.  The deployment
    publishes only the dashboard listener and the loopback-only Plex ingress;
    no route in this document exposes container lifecycle controls.  Any
    upstream Plex operation remains on the private administrator inventory and
    confirmation boundary; it is not part of the shared surface below.
    Responses are bounded and sanitized; credentials,
    raw provider payloads, filesystem paths, webhook uploads, and actor tokens
    are never returned by these routes.
servers: []
tags:
  - name: Probes
    description: Anonymous liveness and authenticated-readiness probes.
  - name: MCP
    description: Actor-bound JSON-RPC tool calls on the private companion.
  - name: Confirmation
    description: Private Hermes confirmation binding and callback routes.
  - name: Private dashboard
    description: Signed, replay-resistant dashboard-to-companion operations.
  - name: Plex webhook
    description: Loopback-only, capability-bearing Plex library observations.

# This inventory is deliberately explicit so generated clients do not mistake
# the legacy stdio tool names for HTTP paths.
x-shared-tools:
  - name: search_media
    classification: read
    arguments: SearchMediaRequest
  - name: request_movie
    classification: safe_mutation
    arguments: RequestMovieRequest
  - name: request_series
    classification: safe_mutation
    arguments: RequestSeriesRequest
  - name: request_status
    classification: read
    arguments: RequestStatusRequest
  - name: download_status
    classification: read
    arguments: EmptyObject
  - name: browse_library
    classification: read
    arguments: BrowseLibraryRequest
  - name: media_status
    classification: read
    arguments: EmptyObject

# The administrator-only proxy remains closed at the checked-in upstream
# contract. This provenance is included for release review without exposing
# those 102 tools as ordinary public operations.
x-upstream-tool-contract:
  version: 2.3.0
  source_revision: 8b469d2b321b27dd1e4f5b89a7236b3ea43c3c72
  image: ghcr.io/wyattjoh/media-server-mcp@sha256:f83620da1d008ef18df3324b15e44854572ea41b528eff585033e4054b438377
  tool_count: 102
  schema_sha256: 31451102af4d424ce516d5515db5839028f17e9363651e0d1a2d64518633f2b1
  required_include:
    - tmdb_get_movie_credits
    - tmdb_get_tv_credits

# The legacy MCP server still documents these useful tool contracts.  They are
# component schemas, not `/tools/<name>` HTTP routes; the companion receives
# them inside the `/mcp` JSON-RPC envelope.
x-legacy-tool-docs:
  transport: stdio-or-companion-mcp
  tools:
    - name: search_media
      request: SearchMediaRequest
      response: SearchMediaResponse
    - name: request_movie
      request: RequestMovieRequest
      response: RequestMovieResponse
    - name: request_series
      request: RequestSeriesRequest
      response: RequestSeriesResponse
    - name: request_status
      request: RequestStatusRequest
      response: RequestStatusResponse
    - name: download_status
      request: EmptyObject
      response: DownloadStatusResponse
    - name: browse_library
      request: BrowseLibraryRequest
      response: BrowseLibraryResponse
    - name: media_status
      request: EmptyObject
      response: MediaStatusResponse

paths:
  /healthz:
    get:
      tags: [Probes]
      operationId: companionHealth
      summary: Liveness probe.
      description: Anonymous process liveness. It does not query providers or expose dependency details.
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /readyz:
    get:
      tags: [Probes]
      operationId: companionReadiness
      summary: Companion readiness probe.
      description: Anonymous readiness result. A false result is returned with HTTP 503.
      responses:
        "200":
          description: Companion is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Companion is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

  /healthz/ready:
    get:
      tags: [Probes]
      operationId: companionReadinessAlias
      summary: Readiness probe alias.
      description: Exact alias of `/readyz` retained by the ASGI application.
      responses:
        "200":
          $ref: "#/paths/~1readyz/get/responses/200"
        "503":
          $ref: "#/paths/~1readyz/get/responses/503"

  /mcp:
    post:
      tags: [MCP]
      operationId: callCompanionTool
      summary: Call one actor-bound media tool.
      description: |
        The only accepted method is JSON-RPC 2.0 `tools/call`. `id` must be a
        string or safe integer, `params.name` must be a frozen tool name, and
        `params.arguments` must be a JSON object. `X-CRBL-Actor` is a short-lived
        assertion issued by the trusted Hermes extension; its audience, tool,
        exact arguments, actor identity, current allowlist fingerprint, and
        nonce are verified before dispatch. Requester identity fields for the
        two safe request tools are overwritten from that assertion, never taken
        from model-provided values. Admin mutations return a confirmation
        preview and cannot execute on this route.
      security:
        - actorAssertion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpToolCallRequest"
            examples:
              sharedSearch:
                summary: Shared tool call
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: tools/call
                  params:
                    name: search_media
                    arguments:
                      query: Dune
                      media_type: movie
                      limit: 5
      responses:
        "200":
          description: JSON-RPC success or a policy/operation result represented in the result object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/RequestDenied"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalFailure"

  /private/confirm/bind:
    post:
      tags: [Confirmation]
      operationId: bindConfirmation
      summary: Bind an exact preview to a native Telegram message.
      description: |
        Private Hermes-to-companion route. The helper presents exactly one
        `X-CRBL-Confirm-Key` (or compatibility alias `X-CRBL-Helper-Key`); the
        key is not a model credential. Binding records the one-time capability,
        chat, message, and exact preview bytes. It does not execute the
        operation.
      security:
        - confirmationHelper: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmationBindRequest"
      responses:
        "200":
          description: Capability is armed for one callback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmationBindResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/RequestDenied"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /private/confirm/callback:
    post:
      tags: [Confirmation]
      operationId: executeConfirmationCallback
      summary: Execute one actor-bound confirmation callback.
      description: |
        Private native Telegram callback route. The request must carry a
        `confirmation-callback` actor assertion bound to the exact token,
        callback query, chat, and message IDs. The capability is checked against
        the durable confirmation record and consumed atomically, so replaying a
        successful callback is denied. This is the only HTTP path that executes
        a privileged confirmation-gated mutation.
      security:
        - actorAssertion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmationCallbackRequest"
      responses:
        "200":
          description: Callback was consumed and the typed operation result is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmationCallbackResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/RequestDenied"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /private/dashboard/{operation}:
    parameters:
      - $ref: "#/components/parameters/DashboardOperation"
    post: &dashboard_post
      tags: [Private dashboard]
      operationId: signedDashboardOperation
      summary: Execute one signed private dashboard operation.
      description: |
        The separate dashboard image signs this request with the dashboard API
        key. Every request must include the required `X-CRBL-Dashboard-*`
        headers listed below. The signature covers the method, exact path,
        operation, actor label, canonical body SHA-256, timestamp, expiry, and
        nonce; the companion consumes the nonce from durable replay storage.
        The actor label is resolved to a current admin identity and policy
        before work. Reads return typed sanitized data. Mutations are preview
        only until a one-time confirmation capability for the exact preview is
        supplied; a copied `true`/`confirm` string is never authorization.
      security:
        - dashboardSignature: []
      x-required-headers:
        - X-CRBL-Dashboard-Version
        - X-CRBL-Dashboard-Operation
        - X-CRBL-Dashboard-Actor
        - X-CRBL-Dashboard-Timestamp
        - X-CRBL-Dashboard-Expires
        - X-CRBL-Dashboard-Nonce
        - X-CRBL-Dashboard-Body-SHA256
        - X-CRBL-Dashboard-Signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardOperationRequest"
            examples:
              read:
                value: {}
              userMutationPreview:
                value:
                  user_id: 42
                  fingerprint: current-policy-fingerprint
                  idempotency_key: dashboard-edit-1
                  version: 1
              deliveryMutationConfirmation:
                value:
                  delivery_id: 7
                  idempotency_key: recovery-7
                  preview_digest: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                  confirmation: opaque-one-time-capability
      responses:
        "200":
          description: Typed dashboard operation result, or a mutation preview with confirmation_required=true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/DashboardDenied"
        "403":
          $ref: "#/components/responses/DashboardDenied"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /private/operations/{operation}:
    parameters:
      - $ref: "#/components/parameters/DashboardOperation"
    post:
      <<: *dashboard_post
      operationId: signedDashboardOperationAlias
      description: Exact compatibility alias of `/private/dashboard/{operation}`.

  /private/plex/{capability}:
    parameters:
      - $ref: "#/components/parameters/PlexCapability"
    post:
      tags: [Plex webhook]
      operationId: ingestPlexLibraryWebhook
      summary: Ingest one loopback Plex library observation.
      description: |
        Plex reaches this route through the host loopback mapping only. The
        path segment is a generated 256-bit capability (43 URL-safe
        characters), compared in constant time before MIME parsing. The route
        accepts only bounded `multipart/form-data`: one JSON `payload` part and
        at most one JPEG `thumb` part. It persists only a normalized event
        inbox record; it cannot read arbitrary Plex URLs, alter Plex, or manage
        containers. Events from an unallowlisted server/library and valid hint
        events are acknowledged as ignored with 204 and no body.
      x-security-boundary:
        type: path-capability
        parameter: capability
        loopback_only: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PlexWebhookMultipart"
            encoding:
              payload:
                contentType: application/json
              thumb:
                contentType: image/jpeg
      responses:
        "202":
          description: A movie/episode event was normalized and durably accepted. Empty response body.
        "204":
          description: Valid but irrelevant/hint event was ignored. Empty response body.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          description: Capability or loopback boundary did not match. Response is deliberately indistinguishable from an unknown route.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

components:
  securitySchemes:
    actorAssertion:
      type: apiKey
      in: header
      name: X-CRBL-Actor
      description: Short-lived signed actor assertion. The assertion is bound to audience, tool, exact arguments, actor policy, and a replay nonce; it is not a bearer API key.
    confirmationHelper:
      type: apiKey
      in: header
      name: X-CRBL-Confirm-Key
      description: Private helper key. The implementation also accepts the exact compatibility header X-CRBL-Helper-Key; send one header, never both.
    dashboardSignature:
      type: apiKey
      in: header
      name: X-CRBL-Dashboard-Signature
      description: HMAC-SHA256 dashboard signature. It is valid only with all other required X-CRBL-Dashboard-* headers and the exact body/path binding.
  parameters:
    DashboardOperation:
      name: operation
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/DashboardOperation"
    PlexCapability:
      name: capability
      in: path
      required: true
      description: URL-safe 256-bit capability generated for the current Plex webhook route.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"

  responses:
    InvalidRequest:
      description: Request shape, content type, or bounded input was rejected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthenticationRequired:
      description: Required private authentication header is missing or ambiguous.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RequestDenied:
      description: Actor, policy, tool, or confirmation was denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DashboardDenied:
      description: Dashboard signature, session identity, policy, or capability was denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BodyTooLarge:
      description: Bounded request body limit was exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: The route's durable or loopback rate limit was exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DependencyUnavailable:
      description: A required durable store or private dependency was unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalFailure:
      description: An unexpected failure was contained at the HTTP boundary.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Compare-and-swap state or preview digest no longer matches.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MethodNotAllowed:
      description: HTTP method is not registered for this route.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    EmptyObject:
      type: object
      additionalProperties: false

    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          description: Stable generic error category; implementation details are intentionally omitted.

    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          const: ok

    ReadyResponse:
      type: object
      required: [status, ready]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        ready:
          type: boolean

    McpToolName:
      type: string
      minLength: 1
      maxLength: 128
      description: One name from the frozen shared or administrator tool inventory.

    SharedToolName:
      type: string
      enum:
        - search_media
        - request_movie
        - request_series
        - request_status
        - download_status
        - browse_library
        - media_status

    McpToolCallParams:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/McpToolName"
        arguments:
          type: object
          additionalProperties: true
          description: Tool-specific JSON object. The actor assertion covers the exact received object.

    McpToolCallRequest:
      type: object
      required: [jsonrpc, id, method, params]
      additionalProperties: false
      properties:
        jsonrpc:
          const: "2.0"
        id:
          oneOf:
            - type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type: string
              minLength: 1
              maxLength: 128
        method:
          const: tools/call
        params:
          $ref: "#/components/schemas/McpToolCallParams"

    McpSuccess:
      type: object
      required: [jsonrpc, id, result]
      additionalProperties: false
      properties:
        jsonrpc:
          const: "2.0"
        id:
          oneOf:
            - type: integer
            - type: string
        result:
          type: object
          additionalProperties: true

    McpError:
      type: object
      required: [jsonrpc, id, error]
      additionalProperties: false
      properties:
        jsonrpc:
          const: "2.0"
        id:
          oneOf:
            - type: integer
            - type: string
            - type: "null"
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: integer
            message:
              const: request denied

    McpResponse:
      oneOf:
        - $ref: "#/components/schemas/McpSuccess"
        - $ref: "#/components/schemas/McpError"

    MediaType:
      type: string
      enum: [movie, series, any]

    SearchMediaRequest:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
        media_type:
          $ref: "#/components/schemas/MediaType"
          default: any
        season:
          type: [integer, "null"]
          minimum: 0
          description: Optional series season filter; 0 means specials.
        limit:
          type: integer
          minimum: 1
          maximum: 10
          default: 5

    RequestMovieRequest:
      type: object
      required: [candidate_handle]
      additionalProperties: false
      description: Request a movie using only a short-lived actor/update-bound handle returned by search_media. Provider identity and title are resolved server-side.
      properties:
        candidate_handle:
          type: string
          minLength: 20
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
        idempotency_key:
          type: string
          maxLength: 512

    RequestSeriesRequest:
      type: object
      required: [candidate_handle, seasons]
      additionalProperties: false
      description: Request only the explicitly listed Sonarr seasons using a short-lived actor/update-bound search handle. Provider identity and title are resolved server-side.
      properties:
        candidate_handle:
          type: string
          minLength: 20
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
        idempotency_key:
          type: string
          maxLength: 512
        seasons:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 0
          description: Explicit season numbers; use 0 only for specials.
        anime:
          type: boolean
          default: false

    RequestStatusRequest:
      type: object
      additionalProperties: false
      properties:
        query:
          type: [string, "null"]
        limit:
          type: integer
          minimum: 1
          maximum: 250
          default: 250

    BrowseLibraryRequest:
      type: object
      additionalProperties: false
      properties:
        media_type:
          $ref: "#/components/schemas/MediaType"
          default: any
        genre:
          type: [string, "null"]
        query:
          type: [string, "null"]
        year_min:
          type: [integer, "null"]
        year_max:
          type: [integer, "null"]
        runtime_max:
          type: [integer, "null"]
          minimum: 0
          description: Movie runtime in minutes.
        language:
          type: [string, "null"]
        limit:
          type: integer
          minimum: 1
          maximum: 10
          default: 10

    SearchMediaResponse:
      type: object
      required: [ok, items]
      additionalProperties: false
      properties:
        ok:
          const: true
        items:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/SearchMovieItem"
              - $ref: "#/components/schemas/SearchSeriesItem"

    SearchMovieItem:
      type: object
      required: [media_type, title, candidate_handle]
      additionalProperties: false
      properties:
        media_type:
          const: movie
        title:
          type: [string, "null"]
        year:
          type: [integer, "null"]
        candidate_handle:
          type: string
          minLength: 20
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
        overview:
          type: [string, "null"]

    SearchSeriesItem:
      type: object
      required: [media_type, title, candidate_handle]
      additionalProperties: false
      properties:
        media_type:
          const: series
        title:
          type: [string, "null"]
        year:
          type: [integer, "null"]
        candidate_handle:
          type: string
          minLength: 20
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
        overview:
          type: [string, "null"]

    RequestMovieResponse:
      type: object
      required: [status, tmdbId]
      additionalProperties: true
      properties:
        status:
          type: string
          enum: [added, already_exists, error]
        title:
          type: [string, "null"]
        tmdbId:
          type: integer
        message:
          type: string

    RequestSeriesResponse:
      type: object
      required: [status, tvdbId, profileUsed]
      additionalProperties: true
      properties:
        status:
          type: string
          enum: [added, already_exists, error]
        title:
          type: [string, "null"]
        tvdbId:
          type: integer
        profileUsed:
          type: string
        monitoredSeasons:
          type: array
          items:
            type: integer
            minimum: 0
        available:
          type: boolean
        availability:
          $ref: "#/components/schemas/SeriesAvailability"
        message:
          type: string

    RequestStatusResponse:
      type: object
      required: [active, items]
      additionalProperties: false
      properties:
        active:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/RequestStatusItem"
        message:
          type: string

    RequestStatusItem:
      type: object
      required: [media_type, status, eta]
      additionalProperties: false
      properties:
        media_type:
          type: string
          enum: [movie, series]
        title:
          type: string
        status:
          type: string
          examples: [downloading, importPending, partially_available, available, waiting_for_release, waiting_for_suitable_release]
        available:
          type: boolean
        availability:
          $ref: "#/components/schemas/SeriesAvailability"
        eta:
          type: [string, "null"]
        progress_percent:
          type: number
        time_left:
          type: string
        tracked_download_status:
          type: string
        tracked_download_state:
          type: string
        download_client:
          type: string
        note:
          type: string
        message:
          type: string

    AvailableMovieStatus:
      type: object
      required: [found, media_type, state, available]
      additionalProperties: false
      properties:
        found:
          type: boolean
        media_type:
          const: movie
        title:
          type: string
        year:
          type: integer
        state:
          const: available
        available:
          const: true
        message:
          type: string

    DownloadStatusResponse:
      type: object
      required: [active, items]
      additionalProperties: false
      properties:
        active:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/QueueItem"
        message:
          type: string

    BrowseLibraryResponse:
      type: object
      required: [ok, items]
      additionalProperties: false
      properties:
        ok:
          const: true
        items:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/LibraryMovie"
              - $ref: "#/components/schemas/LibrarySeries"
        message:
          type: string

    QueueItem:
      type: object
      required: [media_type]
      additionalProperties: false
      properties:
        media_type:
          type: string
          enum: [movie, series]
        title:
          type: string
        status:
          type: string
        progress_percent:
          type: number
        time_left:
          type: string
        tracked_download_status:
          type: string
        tracked_download_state:
          type: string
        download_client:
          type: string
        note:
          type: string

    LibraryMovie:
      type: object
      required: [title, year, media_type, available]
      additionalProperties: false
      properties:
        title:
          type: [string, "null"]
        year:
          type: [integer, "null"]
        media_type:
          const: movie
        available:
          const: true
        genres:
          type: array
          items:
            type: string
        runtimeMinutes:
          type: [integer, "null"]
        overview:
          type: [string, "null"]
        imdbId:
          type: [string, "null"]
        tmdbId:
          type: [integer, "null"]
        posterUrl:
          type: [string, "null"]
          format: uri
        language:
          type: [string, "null"]

    LibrarySeries:
      type: object
      required: [title, year, media_type, available, availability]
      additionalProperties: false
      properties:
        title:
          type: [string, "null"]
        year:
          type: [integer, "null"]
        media_type:
          const: series
        available:
          const: true
        genres:
          type: array
          items:
            type: string
        seasons:
          type: array
          items:
            type: integer
            minimum: 0
        status:
          type: [string, "null"]
        overview:
          type: [string, "null"]
        imdbId:
          type: [string, "null"]
        tmdbId:
          type: [integer, "null"]
        tvdbId:
          type: [integer, "null"]
        posterUrl:
          type: [string, "null"]
          format: uri
        language:
          type: [string, "null"]
        availability:
          $ref: "#/components/schemas/SeriesAvailability"

    SeriesAvailability:
      type: object
      required: [availableEpisodes, missingEpisodes, totalEpisodes, seasons]
      additionalProperties: false
      properties:
        availableEpisodes:
          type: integer
          minimum: 0
        missingEpisodes:
          type: integer
          minimum: 0
        totalEpisodes:
          type: integer
          minimum: 0
        missingSeasons:
          type: array
          items:
            type: integer
            minimum: 0
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/SeasonAvailability"

    SeasonAvailability:
      type: object
      required: [season, available, availableEpisodes, missingEpisodes, totalEpisodes]
      additionalProperties: false
      properties:
        season:
          type: integer
          minimum: 0
        available:
          type: boolean
        availableEpisodes:
          type: integer
          minimum: 0
        missingEpisodes:
          type: integer
          minimum: 0
        totalEpisodes:
          type: integer
          minimum: 0

    MediaStatusResponse:
      type: object
      required: [radarr, sonarr]
      additionalProperties: false
      properties:
        radarr:
          $ref: "#/components/schemas/ServiceStatus"
        sonarr:
          $ref: "#/components/schemas/ServiceStatus"

    ServiceStatus:
      type: object
      required: [ok, version, message]
      additionalProperties: false
      properties:
        ok:
          type: boolean
        version:
          type: [string, "null"]
        message:
          type: string

    ConfirmationToken:
      type: string
      pattern: "^[A-Za-z0-9_-]{43}$"
      description: One-time URL-safe confirmation token; never model-visible.

    ConfirmationBindRequest:
      type: object
      required: [token, chat_id, message_id, preview]
      additionalProperties: false
      properties:
        token:
          $ref: "#/components/schemas/ConfirmationToken"
        chat_id:
          type: integer
          not:
            const: 0
        message_id:
          type: integer
          minimum: 1
        preview:
          type: string
          maxLength: 65536

    ConfirmationBindResponse:
      type: object
      required: [ok, state, token_hash]
      additionalProperties: false
      properties:
        ok:
          const: true
        state:
          const: armed
        token_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"

    ConfirmationCallbackRequest:
      type: object
      required: [token, callback_query_id, chat_id, message_id]
      additionalProperties: false
      properties:
        token:
          $ref: "#/components/schemas/ConfirmationToken"
        callback_query_id:
          type: string
          minLength: 1
          maxLength: 256
        chat_id:
          type: integer
          not:
            const: 0
        message_id:
          type: integer
          minimum: 1

    ConfirmationCallbackResponse:
      type: object
      required: [ok, result]
      additionalProperties: false
      properties:
        ok:
          const: true
        result:
          type: object
          additionalProperties: true

    DashboardOperation:
      type: string
      enum:
        - health
        - users
        - users.resolve
        - blocked
        - subscriptions
        - deliveries
        - quarantine
        - oracle
        - audit
        - users.add
        - users.remove
        - delivery.retry_once
        - delivery.mark_abandoned
        - delivery.assume_sent
        - delivery.resend_once

    DashboardReadRequest:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 250
        cursor:
          type: string
          minLength: 1
          maxLength: 4096
        status:
          type: string
          minLength: 1
          maxLength: 64
      description: "`health` and `oracle` require `{}`; `users.resolve` accepts the identity compare-and-swap fields; other reads accept only the listed bounded pagination fields, and `deliveries` additionally accepts `status`."

    DashboardUserResolveRequest:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        fingerprint:
          type: string
          minLength: 1
          maxLength: 256
        version:
          type: integer
          minimum: 0
          maximum: 9007199254740991

    DashboardUserMutationRequest:
      type: object
      required: [user_id, fingerprint, idempotency_key]
      additionalProperties: false
      properties:
        user_id:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        fingerprint:
          type: string
          minLength: 1
          maxLength: 256
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 512
          pattern: "^[^\\s\\u0000-\\u001f]+$"
        version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        state_fingerprint:
          type: string
          minLength: 1
          maxLength: 256
        preview_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        confirmation:
          type: string
          minLength: 16
          maxLength: 1024
          pattern: "^[A-Za-z0-9_-]{16,1024}$"

    DashboardDeliveryMutationRequest:
      type: object
      required: [delivery_id, idempotency_key]
      additionalProperties: false
      properties:
        delivery_id:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 512
          pattern: "^[^\\s\\u0000-\\u001f]+$"
        preview_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        confirmation:
          type: string
          minLength: 16
          maxLength: 1024
          pattern: "^[A-Za-z0-9_-]{16,1024}$"

    DashboardOperationRequest:
      oneOf:
        - $ref: "#/components/schemas/EmptyObject"
        - $ref: "#/components/schemas/DashboardReadRequest"
        - $ref: "#/components/schemas/DashboardUserResolveRequest"
        - $ref: "#/components/schemas/DashboardUserMutationRequest"
        - $ref: "#/components/schemas/DashboardDeliveryMutationRequest"
      description: Shape is selected by the operation path. A mutation requires the paired preview_digest and confirmation fields for execution; omitting them requests a preview.

    DashboardResponse:
      type: object
      required: [ok, operation, data]
      additionalProperties: false
      properties:
        ok:
          const: true
        operation:
          $ref: "#/components/schemas/DashboardOperation"
        data:
          type: object
          additionalProperties: true

    PlexWebhookMultipart:
      type: object
      required: [payload]
      additionalProperties: false
      properties:
        payload:
          $ref: "#/components/schemas/PlexWebhookPayload"
        thumb:
          type: string
          format: binary
          description: Optional JPEG poster, counted and hashed only; bytes are never persisted or returned.

    PlexWebhookPayload:
      type: object
      required: [event, server, metadata]
      additionalProperties: false
      properties:
        event:
          type: string
          const: library.new
        server:
          type: object
          required: [uuid]
          additionalProperties: true
          properties:
            uuid:
              type: string
              minLength: 1
              maxLength: 128
            machineIdentifier:
              type: string
              maxLength: 256
        metadata:
          type: object
          required: [type, ratingKey, title]
          additionalProperties: true
          properties:
            type:
              type: string
              enum: [movie, episode, show, season]
              description: Only movie and episode units are persisted; show/season hints are valid but ignored by the HTTP adapter.
            ratingKey:
              type: string
              pattern: "^[1-9][0-9]*$"
              maxLength: 32
            title:
              type: string
              minLength: 1
              maxLength: 1024
            year:
              type: integer
              minimum: 1800
              maximum: 3000
            librarySectionUUID:
              oneOf:
                - type: string
                - type: integer
                  minimum: 1
            librarySectionTitle:
              type: string
              maxLength: 256
            parentIndex:
              type: integer
              minimum: 0
            index:
              type: integer
              minimum: 0
            parentRatingKey:
              type: string
              pattern: "^[1-9][0-9]*$"
              maxLength: 32
            grandparentRatingKey:
              type: string
              pattern: "^[1-9][0-9]*$"
              maxLength: 32
            addedAt:
              type: [integer, number]
              exclusiveMinimum: 0
