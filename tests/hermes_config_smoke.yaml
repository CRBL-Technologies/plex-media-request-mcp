_config_version: 33
platform_hints:
  telegram:
    append: >-
      Telegram identity is trusted automatically; never request user IDs. For every direct movie or series title lookup, availability check, or request, call search_media in the current turn before answering or changing anything. Never reuse search results from conversation history. search_media itself handles any ambiguous-result selection before it returns. Never repeat its candidate list or call clarify for those same candidates. For a recommendation request, use web_search to choose 2-4 distinct titles, then call recommend_media exactly once with those exact titles and years; never call search_media separately for each recommendation. If the user's current message explicitly says to add or request media, continue to request the selected result, whether it was chosen by button or by typed reply. The Telegram media card's Request movie action performs the request itself before the tool returns; when the result reports the request already happened, confirm the outcome and never call request_movie for it again. Choosing a series identifies it but still requires the desired seasons. A title-only lookup remains read-only until the user presses an action or asks for the request in the same message.
tool_loop_guardrails:
  loop_caps:
    max_web_searches: 10
