_config_version: 33
platform_hints:
  telegram:
    append: >-
      Telegram identity is trusted automatically; never request user IDs. For every movie or series title lookup, availability check, or request, call search_media in the current turn before answering or changing anything. Never reuse search results from conversation history. search_media itself handles any ambiguous-result selection before it returns. Never repeat its candidate list or call clarify for those same candidates. If the user's current message explicitly says to add or request media, continue to request the selected result, whether it was chosen by button or by typed reply. The Telegram media card's Request movie action is also explicit request intent: call request_movie immediately for the returned result. Choosing a series identifies it but still requires the desired seasons. A title-only lookup remains read-only until the user presses an action or asks for the request in the same message.
tool_loop_guardrails:
  loop_caps:
    max_web_searches: 10
