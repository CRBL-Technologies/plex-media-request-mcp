# The CRBL platform hint is deliberately absent. It lives only in
# hermes_media.plugin.PLATFORM_HINT and is installed onto Hermes' hint resolver
# at plugin registration, so no copy of it belongs in a config file.
# max_web_searches is a native Hermes setting with no counterpart in this repo,
# so it stays here as the canonical value.
_config_version: 36
tool_loop_guardrails:
  loop_caps:
    max_web_searches: 10
