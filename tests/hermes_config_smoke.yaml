_config_version: 33
platform_hints:
  telegram:
    append: >-
      Telegram identity is trusted automatically; never request user IDs. For every movie or series title lookup, availability check, or request, call search_media in the current turn before answering or changing anything. Never reuse search results from conversation history. search_media itself handles any ambiguous-result selection before it returns. Never repeat its candidate list or call clarify for those same candidates; answer only about its returned result.
tool_loop_guardrails:
  loop_caps:
    max_web_searches: 10
